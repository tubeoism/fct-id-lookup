name: eTax Crawler Automation

on:
  schedule:
    # Chạy bổ sung hàng ngày vào lúc 00:00 UTC trừ ngày 1
    - cron: '0 0 2-31 * *'
    # Chạy cập nhật toàn bộ vào lúc 00:00 UTC ngày 1 hàng tháng
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Chế độ chạy'
        required: true
        default: 'append'
        type: choice
        options:
          - append
          - full

jobs:
  crawl_and_update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Crawler
        run: |
          if [[ "${{ github.event.schedule }}" == "0 0 1 * *" || "${{ inputs.mode }}" == "full" ]]; then
            echo "Running FULL update..."
            npm run crawl:full
          else
            echo "Running APPEND update..."
            npm run crawl
          fi

      - name: Check for changes
        id: git-check
        run: |
          git status --porcelain
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Data
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add registered_contractors.json registered_contractors.csv
          git diff --staged --quiet || git commit -m "Auto-update contractors data 🤖"
          git push
